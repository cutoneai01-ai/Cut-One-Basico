# RF-G01 §5 RN-04. El redirect SPA vive en `public/_redirects` (el bundler copia `public/` tal cual al
# artefacto), igual que en `pz-personalizado`. Sin él, entrar directo o recargar en `/encuesta/{id}` —que
# es LA ÚNICA forma de llegar a esa ruta, desde un link de correo— devuelve 404.
#
# Aquí quedan solo las cabeceras de caché. `index.html` no se puede cachear: es el documento que
# arranca la app y el que apunta a los bundles con hash.

[build]
  command = "npm run build"
  publish = "dist/cut-one-basic/browser"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Los bundles llevan hash en el nombre (`outputHashing: all`), así que son inmutables.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Las imágenes semilla NO llevan hash (viven en `public/`), así que no pueden ser inmutables.
[[headers]]
  for = "/seed/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# RF-TT03 §4. Segunda capa de las tres que protegen `/__preview` de renderizar una barbería inventada
# bajo el host de un tenant real (Cloudflare fronte el mismo deploy en `{subdominio}.cutoneai.com`, así
# que esta ruta resuelve ahí también). Defensa en profundidad y la única que impone el NAVEGADOR — la
# primera capa, y la que de verdad protege, es la comprobación de ancestro en `PreviewPage`
# (`preview/preview-page.ts`).
#
# `frame-ancestors` restringe QUIÉN puede embeber esta ruta en un iframe; `X-Robots-Tag` evita que un
# buscador la indexe. Ninguna de las dos toca las cabeceras de `/*`: la landing pública sigue siendo
# embebible hoy, y volverla no-embebible es un cambio distinto con otros afectados.
#
# Pendiente de verificar con `curl -I` tras el próximo despliegue (no hecho en este trabajo: no se
# desplegó nada): que `for = "/__preview"` siga aplicando aunque `public/_redirects` reescriba esa
# petición a `/index.html` con `200`. El precedente en este mismo archivo es la regla de
# `for = "/index.html"` de arriba, que solo tiene sentido si Netlify empareja `[[headers]]` contra el
# PATH SOLICITADO por el navegador y no contra el archivo que termina sirviendo — pero el propio RF-TT03
# lo marca como "a verificar, no asumir" y así queda.
[[headers]]
  for = "/__preview"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "frame-ancestors https://gestioncutone.netlify.app"
