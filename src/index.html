<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Decisión 10 de 005-rfs-front: este documento es un shell único que se sirve a TODOS los
       subdominios, así que no puede llevar el nombre de ningún tenant. El título y el favicon se
       corrigen en cuanto llega el branding (RF-G02 §8); las etiquetas Open Graph no se pueden
       corregir así —los crawlers de WhatsApp y Facebook no ejecutan JavaScript— y siguen fuera de
       alcance (decisión 16 de la serie 008). -->
  <title>Reserva tu cita</title>
  <meta name="description" content="Agenda tu cita en línea: elige servicio, profesional y horario.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <cob-root></cob-root>

  <!-- Splash de arranque Cut One: HTML/CSS estático que aparece antes de que monte Angular y se
       retira solo en cuanto <cob-root> recibe contenido (MutationObserver), con un fallback por
       tiempo. Va inline a propósito para pintarse en el primer frame, sin esperar al bundle.

       Colores neutros y a propósito: desde que el tema es del tenant, la mitad del catálogo es claro,
       y un splash oscuro fijo mostraría negro-y-luego-blanco en la primera visita de cada dispositivo
       de cualquier barbería con tema claro (no hay snapshot que leer todavía en esa primera visita,
       así que el destello no se puede evitar leyendo el tema antes de pintar). El splash sigue siendo
       marca de plataforma, no del tenant — no se vuelve configurable por eso. -->
  <div id="cutone-splash" aria-hidden="true">
    <div class="cutone-splash-box">
      <div class="cutone-splash-rotor">
        <span class="cutone-splash-comet"></span>
        <span class="cutone-splash-head"></span>
      </div>
    </div>
    <div class="cutone-splash-wm">Cut<span>&nbsp;One</span></div>
  </div>
  <style>
    #cutone-splash{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:radial-gradient(120% 120% at 50% 40%,#7d7d7d 0%,#636363 60%,#505050 100%);transition:opacity .45s ease}
    #cutone-splash.cutone-hide{opacity:0;pointer-events:none}
    #cutone-splash .cutone-splash-box{position:relative;width:78px;height:78px}
    #cutone-splash .cutone-splash-rotor{position:absolute;inset:0;animation:cutone-spin 1s linear infinite}
    @keyframes cutone-spin{to{transform:rotate(360deg)}}
    #cutone-splash .cutone-splash-comet{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,255,255,0) 0deg,rgba(255,255,255,0) 55deg,rgba(255,255,255,.93) 350deg,rgba(255,255,255,0) 360deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.6px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.6px))}
    #cutone-splash .cutone-splash-head{position:absolute;top:-.5px;left:50%;width:5px;height:5px;border-radius:50%;background:#fff;transform:translateX(-50%)}
    #cutone-splash .cutone-splash-wm{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:17px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;padding-left:.32em;white-space:nowrap;color:#f5f5f5}
    #cutone-splash .cutone-splash-wm span{color:#c9a24b}
    @media (prefers-reduced-motion:reduce){#cutone-splash .cutone-splash-rotor{animation-duration:2.4s}}
  </style>
  <script>
    (function () {
      var MIN = 500, start = Date.now(), done = false, root, obs, poll;
      // El shell del framework monta casi vacío (alto ~0) y solo DESPUÉS pinta el
      // contenido real, muchas veces tras un fetch a la API. Si retiramos el splash
      // en la primera mutación (shell montado) queda un hueco de fondo oscuro hasta
      // que llegan los datos. Por eso esperamos a que el root tenga ALTURA visible.
      function contentReady() {
        if (!root) return false;
        var kids = root.children, max = 0, i, h;
        for (i = 0; i < kids.length; i++) {
          h = kids[i].getBoundingClientRect().height;
          if (h > max) max = h;
        }
        if (!max) max = root.getBoundingClientRect().height;
        return max > 120;
      }
      function cleanup() {
        if (obs) { obs.disconnect(); obs = null; }
        if (poll) { clearInterval(poll); poll = null; }
      }
      function hide() {
        if (done) return; done = true;
        cleanup();
        var el = document.getElementById('cutone-splash');
        if (!el) return;
        var wait = Math.max(0, MIN - (Date.now() - start));
        setTimeout(function () {
          el.classList.add('cutone-hide');
          setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 500);
        }, wait);
      }
      function maybeHide() { if (contentReady()) { hide(); return true; } return false; }
      window.__hideCutOneSplash = hide;
      try {
        root = document.querySelector('cob-root');
        if (root && !maybeHide()) {
          obs = new MutationObserver(maybeHide);
          obs.observe(root, { childList: true, subtree: true });
          // Respaldo: el contenido puede crecer por un reflow tras cargar datos sin
          // una mutación que el observer capte, así que también sondeamos.
          poll = setInterval(maybeHide, 120);
        }
      } catch (e) {}
      setTimeout(hide, 10000);
    })();
  </script>
</body>
</html>
