<header class="header">
  <div class="cob-container header__inner">
    <!-- En el perfil (M-08 RN-DISPO-62) la marca vuelve a la landing de la barbería sin recargar; en la
         landing, sube al principio de la página. -->
    @if (profile()) {
      <a class="brand" routerLink="/">
        <ng-container *ngTemplateOutlet="brand" />
      </a>
    } @else {
      <a class="brand" cobSectionLink="top">
        <ng-container *ngTemplateOutlet="brand" />
      </a>
    }

    <ng-template #brand>
      @if (logo(); as src) {
        <img class="brand__logo" [src]="src" [alt]="branding().shop_name || 'Logo'" />
      }
      <span class="brand__text">
        @if (branding().shop_name) {
          <strong class="brand__name">{{ branding().shop_name }}</strong>
        }
        @if (branding().slogan) {
          <span class="brand__slogan cob-muted">{{ branding().slogan }}</span>
        } @else if (branding().est_year) {
          <span class="brand__slogan cob-muted">Desde {{ branding().est_year }}</span>
        }
      </span>
    </ng-template>

    <nav class="nav" aria-label="Secciones">
      <a cobSectionLink="servicios">Servicios</a>
      <!-- M-08 RN-DISPO-64: el perfil no tiene sección de equipo, así que no hay a dónde llevar. -->
      @if (!profile()) {
        <a cobSectionLink="barberos">Barberos</a>
      }
      <a cobSectionLink="nosotros">Sobre Nosotros</a>
      <a cobSectionLink="contacto">Contacto</a>
    </nav>

    <p-button label="Reservar Cita" icon="pi pi-calendar-plus" (onClick)="book.emit()" />
  </div>
</header>
