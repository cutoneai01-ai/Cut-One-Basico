<section class="cob-section" id="tu-barbero" aria-labelledby="tu-barbero-nombre">
  <div class="cob-container">
    <p-card>
      <div class="mybarber">
        <!-- CB-02 RN-CBPER-02: el avatar de CB-07 RN-CBBAS-08; el nombre va escrito al lado. -->
        <cob-barber-avatar [barber]="barber()" size="xxl" />

        <div class="mybarber__info">
          <span class="cob-eyebrow">Tu barbero</span>
          <h2 class="mybarber__name" id="tu-barbero-nombre">{{ name() }}</h2>

          @if (barber().specialty) {
            <span class="mybarber__specialty">{{ barber().specialty }}</span>
          }

          <!-- M-08 RN-DISPO-70: la presentación, recortada a 3 renglones como en el equipo, sin hover ni
               color. Sin descripción no se pinta nada. -->
          @if (description(); as text) {
            <cob-clamped-text class="mybarber__desc" [text]="text" />
          }

          <!-- CB-07 RN-CBBAS-09 y M-23 RN-CAL-11: la nota con un decimal, o «Nuevo» sin reseñas. -->
          <cob-rating-stars class="mybarber__rating" [rating]="barber().rating" />

          <div class="mybarber__actions">
            <p-button
              [label]="'Reservar con ' + name()"
              icon="pi pi-calendar-plus"
              size="large"
              (onClick)="book.emit()"
            />
            @if (serviceCount() > 0) {
              <a class="mybarber__link" cobSectionLink="servicios">Ver sus servicios</a>
            }
          </div>

          @if (serviceCount() > 0) {
            <p class="mybarber__count">{{ serviceCountText() }}</p>
          }
        </div>
      </div>
    </p-card>
  </div>
</section>
